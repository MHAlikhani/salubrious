name: 'salubrious'
description: 'Know the health of your dependency tree before it kills your build. Nine dependency health signals: abandoned, archived, deprecated, bus-factor, new-maintainer, major-drift, no-license, risky-license and typosquat-risk.'
author: 'Mohammad Hossein Alikhani'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  fail-on:
    description: 'Fail the job on: warning | at-risk | critical'
    required: false
    default: ''
  fail-threshold:
    description: 'Fail the job if the overall score is below this number'
    required: false
    default: ''
  include-dev:
    description: 'Include devDependencies in the analysis'
    required: false
    default: 'false'
  ignore:
    description: 'Comma-separated globs to ignore (e.g. @types/*,eslint-*)'
    required: false
    default: ''
  only:
    description: 'Comma-separated signal IDs to run'
    required: false
    default: ''
  config:
    description: 'Config file path'
    required: false
    default: ''
  cache-dir:
    description: 'Cache directory'
    required: false
    default: ''
  no-cache:
    description: 'Disable the cache'
    required: false
    default: 'false'
  offline:
    description: 'Offline mode (use cached data only)'
    required: false
    default: 'false'
  format:
    description: 'Output format: human | json | markdown | sarif | github-actions'
    required: false
    default: 'github-actions'
  working-directory:
    description: 'Directory to analyse'
    required: false
    default: '.'
  concurrency:
    description: 'Number of packages analysed in parallel'
    required: false
    default: '10'
  version:
    description: 'salubrious version to install from npm'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install salubrious
      shell: bash
      run: npm install --global "salubrious@${{ inputs.version }}"

    - name: Run salubrious
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ARGS=()
        if [ -n "${{ inputs.fail-on }}" ]; then ARGS+=("--fail-on=${{ inputs.fail-on }}"); fi
        if [ -n "${{ inputs.fail-threshold }}" ]; then ARGS+=("--fail-threshold=${{ inputs.fail-threshold }}"); fi
        if [ "${{ inputs.include-dev }}" = "true" ]; then ARGS+=("--include-dev"); fi
        if [ -n "${{ inputs.ignore }}" ]; then ARGS+=("--ignore=${{ inputs.ignore }}"); fi
        if [ -n "${{ inputs.only }}" ]; then ARGS+=("--only=${{ inputs.only }}"); fi
        if [ -n "${{ inputs.config }}" ]; then ARGS+=("--config=${{ inputs.config }}"); fi
        if [ -n "${{ inputs.cache-dir }}" ]; then ARGS+=("--cache=${{ inputs.cache-dir }}"); fi
        if [ "${{ inputs.no-cache }}" = "true" ]; then ARGS+=("--no-cache"); fi
        if [ "${{ inputs.offline }}" = "true" ]; then ARGS+=("--offline"); fi
        if [ -n "${{ inputs.concurrency }}" ]; then ARGS+=("--concurrency=${{ inputs.concurrency }}"); fi

        # The CLI takes one flag per format, there is no --format= option.
        case "${{ inputs.format }}" in
          json) ARGS+=("--json") ;;
          markdown) ARGS+=("--markdown") ;;
          sarif) ARGS+=("--sarif") ;;
          github-actions) ARGS+=("--github-actions") ;;
          human) ;;
          "") ;;
          *) echo "Unknown format '${{ inputs.format }}', falling back to human output." ;;
        esac

        echo "salubrious ${ARGS[*]}"
        salubrious "${ARGS[@]}"
